name: Build APK

# Builds an installable debug APK on every push, so you can grab a known-good build
# from the Actions tab without needing Android Studio or a computer at all.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Needed to publish the APK to a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        run: ./gradlew test --stacktrace

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The reason installing over the top used to fail. A runner is a fresh machine, so the
      # Android plugin used to generate a new signing key on every build, and Android refuses
      # to update an app whose signature changed. The key now lives in the repository, and
      # this fails the build if anything goes back to signing with a throwaway one.
      - name: Check the APK is signed with the project's key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          FINGERPRINT=$("$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          EXPECTED=$(cat app/expected-signer.sha256)
          echo "signed by: $FINGERPRINT"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::The APK is signed with $FINGERPRINT, not the project key $EXPECTED."
            echo "::error::Installing this build over an existing one would fail."
            exit 1
          fi

      # The APK is named after the commit so it is obvious which build you installed.
      - name: Name the APK after the commit
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          BUILD=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/ficha-${VERSION}-${SHORT_SHA}.apk"
          ls -lh out/
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ficha-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      # A rolling "latest" release, so the phone always has one stable link to a raw .apk.
      # Artifacts arrive as a ZIP, which is painful to unpack on a phone; this is a direct
      # download that taps straight into the Android installer.
      - name: Publish the APK to the latest release
        if: github.ref_name == 'claude/dnd-character-sheet-android-mvkrja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "Latest build — v${{ steps.apk.outputs.version }} (build ${{ steps.apk.outputs.build }})" \
            --notes "Debug build of \`${{ steps.apk.outputs.sha }}\`.

          The home screen shows **v${{ steps.apk.outputs.version }} (build ${{ steps.apk.outputs.build }})** under the title.

          **Installing over the top now works.** Every build before 49 was signed with a throwaway key, which is why updating always failed and the app had to be uninstalled first. From build 49 on the key is fixed, so each build installs as an update to the one before — but going from an older build to this one needs one last uninstall, because the old signature can never match.

          **Back up your characters before uninstalling.** Uninstalling deletes them along with the app. On the home screen, tap the ⋮ menu and choose **Back up characters**, then **Restore from backup** once the new build is installed. Installing over the top keeps everything; only uninstalling loses it.

          Built and tested automatically from [${{ steps.apk.outputs.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})."
          # Deliberately not a prerelease: GitHub's /releases/latest skips those, and that
          # URL is the whole point of publishing here — one stable link to bookmark.
          gh release view latest --json isPrerelease --jq '.isPrerelease'

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14
