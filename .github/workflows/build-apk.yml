name: Build APK

# Builds an installable debug APK on every push, so you can grab a known-good build
# from the Actions tab without needing Android Studio or a computer at all.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        run: ./gradlew test --stacktrace

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The APK is named after the commit so it is obvious which build you installed.
      - name: Name the APK after the commit
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/ficha-${VERSION}-${SHORT_SHA}.apk"
          ls -lh out/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ficha-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14
